# AIVS on a virtual server with automatic HTTPS (Caddy obtains and renews the certificate).
# 1. Point a domain (for example aivs.example.org) at the server's IP address.
# 2. Copy .env.example to .env next to this file and fill in AIVS_DOMAIN and any keys.
# 3. docker compose up -d      Logs: docker compose logs -f aivs
services:
  aivs:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:                   # fixed for this layout; these win over anything in .env
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
    volumes:
      - aivs-data:/app/data
      - aivs-backups:/app/backups
    expose: ["8080"]               # reachable only by Caddy, never directly from the internet
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - AIVS_DOMAIN=${AIVS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [aivs]
volumes:
  aivs-data:
  aivs-backups:
  caddy-data:
  caddy-config:
